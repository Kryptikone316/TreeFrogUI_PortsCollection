# Picture tuning for Defense Mania on the Data Frog SF3500. Edit, save, relaunch the game.
# The colours are worked out once, while a map loads, so this costs nothing while playing.
#
# brightness  -100 .. 100   0 = unchanged   (higher = lighter)
# contrast     0 .. 200     100 = unchanged (higher = darker darks, brighter lights)
# saturation   0 .. 200     100 = unchanged (higher = stronger colours, 0 = grey)
# gamma        0.5 .. 2.5   1.0 = unchanged (higher = lighter midtones, lower = deeper midtones)
#
# A value can be set for one map by putting its name in front:
#   mountains_  maze_  woods_  river_side_  bigger_
# for example "woods_saturation = 130" changes only Dark Woods.
brightness = 0
contrast = 112
saturation = 115
gamma = 1.0
woods_contrast = 120
woods_saturation = 125

# Menu options, also in Options on the title screen: 1 = on
show_fps = 0
hq_graphics = 0

# Volumes, 0..100, also in Options. Music: a random track from music/<folder of the map>, then another when it ends.
master_volume = 80
music_volume = 60
sfx_volume = 80

# Endless mode (unlocked per map by playing all three difficulties of it perfectly). Each wave the creatures grow
# tougher by these amounts (0.07 = 7% more health per wave, compounding). The gold per kill grows too, but slower.
# endless_unlocked = 1 opens it on every map at once.
endless_hp_growth = 0.07
endless_speed_growth = 0.008
endless_count_growth = 0.03
endless_money_growth = 0.05
endless_damage_growth = 0.04
endless_unlocked = 0

# Frame rate: the game never sends more than fps_cap frames a second (0 = no limit). 30 keeps the picture and the sound
# steady on the SF3500, whose display driver runs at its own pace; most maps would otherwise hover around 35-40.
fps_cap = 30

# Display experiments (leave alone unless asked): frame_buffers = 3 draws each frame into the next of three canvases,
# 1 reuses a single one. present_480 = 1 hands the driver a full 640x480 frame (our picture stretched in height) instead
# of the 640x358 canvas (the checks of slot_check below are off in that mode).
frame_buffers = 3
present_480 = 0

# unlock_all_difficulties = 1 opens Normal and Hard on every map without winning the one before.
unlock_all_difficulties = 0

# slot_check = 1 checks every frame the game sends against what the display driver rendered into /dev/fb0 (it keeps a copy
# of the last 40 frames, about 18 MB, and a low-priority thread reads the driver's output); SLOTCHECK lines go to log.txt.
# A diagnostic for display glitches (a rare one-frame "ghost tower" was traced to the game's own picture, see the notes in
# the source); leave it off otherwise. With it on, the Y button during play saves the driver's frame ring (about 23 MB).
slot_check = 0
